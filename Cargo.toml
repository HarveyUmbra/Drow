[workspace]
resolver = "3"
members = [
    "drow_debug",
    "drow_lib",
    "drow_main",
    "drow_nav"
]

[workspace.dependencies]
avian3d = "0.4.1"                       # Crate für die Physik von Bevy
bevy-inspector-egui = "=0.35.0"         # Crate zu Help Devtools anzeige von allen entitys
vleue_navigator = { version = "0.14", features = ["avian3d"] }      # Zu erzeugung von NavMesh und nutzung des A* algoritmus
drow_lib = { path = "./drow_lib" }      # Crate für das Eigentliche Spiel
drow_debug = { path = "./drow_debug" }  # Bereitstellen aller Entwickler tools die ich brauche


[workspace.dependencies.bevy]
version = "0.17.3"
default-features = true
features = []
